name: Build Spektrafilm extra stocks (CineStill / B&W)

on:
  workflow_dispatch:
    inputs:
      resolution:
        description: 'LUT grid size'
        type: string
        default: '33'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      films: ${{ steps.list.outputs.films }}
    steps:
      - name: Fixed extra stock list
        id: list
        run: echo 'films=["cinestill_800t","kodak_tri_x_400","kodak_tmax_100","ilford_hp5_plus_400","fujifilm_neopan_acros_100_ii"]' >> "$GITHUB_OUTPUT"

  bake:
    needs: prepare
    if: ${{ needs.prepare.outputs.films != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        film: ${{ fromJson(needs.prepare.outputs.films) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install engine
        run: |
          set -e
          git clone --depth 1 https://github.com/andreavolpato/spektrafilm.git sf
          git clone --depth 1 https://github.com/thetechgeekko/Spektrafilm-android.git port
          cp -v port/engine/spektra-core/src/main/assets/spektra/profiles/*.json sf/src/spektrafilm/data/profiles/ || true

      - name: Strip unsupported profile fields
        run: |
          python - <<'PYJSON'
          import glob, json, os
          for path in glob.glob("sf/src/spektrafilm/data/profiles/*.json"):
              data = json.load(open(path))
              meta = data.get("metadata")
              if isinstance(meta, dict):
                  dropped = [k for k in ("derived_from", "derivation", "derivedFrom") if meta.pop(k, None) is not None]
                  if dropped:
                      json.dump(data, open(path, "w"), indent=2)
                      print("stripped", os.path.basename(path), dropped)
          PYJSON

      - name: Install engine deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ./sf --no-deps
          pip install numpy scipy colour-science scikit-image opt-einsum numba Pillow matplotlib OpenImageIO pyfftw rawpy exiv2 lensfunpy tomli

      - name: List prints for ${{ matrix.film }}
        id: prints
        run: |
          python - <<'PY'
          import os,subprocess
          out=subprocess.run(["spektrafilm-lut","list","print"],capture_output=True,text=True)
          text=(out.stdout or "")+(out.stderr or "")
          names=[]
          for line in text.splitlines():
              tok=line.strip().split(" ")[0].split("\t")[0]
              if tok.replace("_","").isalnum() and "_" in tok:
                  names.append(tok)
          names=sorted(set(names))
          print("prints:",len(names))
          open(os.environ["GITHUB_OUTPUT"],"a").write("prints="+",".join(names)+"\n")
          PY

      - name: Bake LUTs for ${{ matrix.film }}
        env:
          FILM: ${{ matrix.film }}
          PRINTS: ${{ steps.prints.outputs.prints }}
          RES: ${{ github.event.inputs.resolution }}
        run: |
          set -e
          mkdir -p out
          IFS=',' read -ra ARR <<< "$PRINTS"
          for PRINT in "${ARR[@]}"; do
            [ -z "$PRINT" ] && continue
            echo "== $FILM / $PRINT"
            spektrafilm-lut build \
              --film "$FILM" --print "$PRINT" \
              --input srgb --output srgb \
              --topology 1lut --resolution "${RES:-33}" \
              --out "./out" || echo "SKIP $FILM/$PRINT (unsupported pair)"
          done
          find out -name '*.cube' -o -name '*.3dl' | head

      - name: Apply -0.45EV prescale to highlight headroom
        run: |
          python - <<'PYSCALE'
          import glob
          P = 0.72
          def read_cube(path):
              hdr, size, data = [], None, []
              for line in open(path):
                  s = line.strip()
                  if not s:
                      hdr.append(line); continue
                  if s.startswith("#") or s[0].isalpha():
                      hdr.append(line)
                      if s.upper().startswith("LUT_3D_SIZE"):
                          size = int(s.split()[-1])
                      continue
                  data.append(tuple(map(float, s.split())))
              return hdr, size, data
          def sample(data, size, rgb):
              pos = [min(max(v, 0.0), 1.0) * (size - 1) for v in rgb]
              i0 = [min(int(v), size - 2) for v in pos]
              f = [v - i for v, i in zip(pos, i0)]
              idx = lambda r, g, b: (b * size + g) * size + r
              out = [0.0, 0.0, 0.0]
              for dz in (0, 1):
                  for dy in (0, 1):
                      for dx in (0, 1):
                          w = (f[0] if dx else 1 - f[0]) * (f[1] if dy else 1 - f[1]) * (f[2] if dz else 1 - f[2])
                          c = data[idx(i0[0] + dx, i0[1] + dy, i0[2] + dz)]
                          for k in range(3):
                              out[k] += w * c[k]
              return out
          for path in glob.glob("out/**/*.cube", recursive=True):
              hdr, size, data = read_cube(path)
              if not size: continue
              new = []
              for b in range(size):
                  for g in range(size):
                      for r in range(size):
                          c = sample(data, size, (r / (size - 1) * P, g / (size - 1) * P, b / (size - 1) * P))
                          new.append([min(1.0, max(0.0, v)) for v in c])
              with open(path, "w") as fh:
                  for line in hdr:
                      fh.write(line if line.endswith("\n") else line + "\n")
                  for c in new:
                      fh.write("%.6f %.6f %.6f\n" % tuple(c))
              print("prescaled", path)
          PYSCALE

      - name: Package film folder
        run: |
          set -e
          mkdir -p stage
          find out -type f \( -name '*.cube' -o -name '*.3dl' \) | while read -r f; do
            cp "$f" "stage/${FILM_SAFE:-${{ matrix.film }}}__$(basename "$f")"
          done
          cd stage && zip -q -r "../lut-${{ matrix.film }}.zip" . || true

      - uses: actions/upload-artifact@v4
        with:
          name: lut-${{ matrix.film }}
          path: lut-${{ matrix.film }}.zip
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [prepare, bake]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: lut-*
          merge-multiple: true
      - name: Combine
        run: |
          set -e
          mkdir -p final
          cd all && for z in *.zip; do [ -f "$z" ] || continue; unzip -q -o "$z" -d ../final; done
          cd ..
          echo "files: $(find final -type f | wc -l)"
          cd final && zip -q -r ../Spektrafilm-LUT-srgb-extra-all.zip . || echo "empty"
      - uses: actions/upload-artifact@v4
        with:
          name: Spektrafilm-LUT-extra
          path: Spektrafilm-LUT-srgb-extra-all.zip
          if-no-files-found: warn
          retention-days: 30
      - name: Release asset
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lut-library-srgb
          name: Spektrafilm LUT library (sRGB)
          files: Spektrafilm-LUT-srgb-extra-all.zip
