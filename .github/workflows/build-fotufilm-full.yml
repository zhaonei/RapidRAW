name: Fotufilm full LUT library

on:
  workflow_dispatch:

jobs:
  bake:
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - name: Install deps
        run: brew install halide libraw little-cms2 libtiff
      - name: Clone fotufilm
        run: git clone --depth 1 https://github.com/zhaonei/fotufilm-engine.git ff
      - name: Build CLI
        working-directory: ff
        run: swift build -c release --product fotufilm 2>&1 | tail -20
      - name: Python deps
        run: python3 -m pip install --break-system-packages --quiet pillow numpy
      - name: Probe paper flag
        working-directory: ff
        run: |
          .build/release/fotufilm --help 2>&1 | grep -i -A2 paper | head -20 || true
          python3 - <<'PY'
          from PIL import Image
          Image.new("RGB",(8,8),(128,128,128)).save("tiny.png")
          PY
          for p in ektacolorEdge ektacolor_edge EktacolorEdge; do
            if .build/release/fotufilm tiny.png tiny_out.png --stock portra400 --paper "$p" >/dev/null 2>&1; then
              echo "PAPER_FLAG_OK=$p"; echo "$p" > paper_style.txt; break
            fi
          done
          cat paper_style.txt 2>/dev/null || echo "PAPER_FLAG_UNKNOWN"
      - name: Bake matrix
        working-directory: ff
        run: |
          set -e
          echo "${{ github.event.inputs.resolution }}" >/dev/null
          python3 - <<'PY'
          import json, os, subprocess, sys
          from PIL import Image
          N = 33
          total = N**3
          W = 189
          H = (total + W - 1)//W
          img = Image.new("RGB", (W, H)); px = img.load()
          i = 0
          for b in range(N):
              for g in range(N):
                  for r in range(N):
                      px[i % W, i // W] = (round(r*255/(N-1)), round(g*255/(N-1)), round(b*255/(N-1)))
                      i += 1
          img.save("lattice.png")

          stocks = []
          out = subprocess.run([".build/release/fotufilm","--list-stocks"],capture_output=True,text=True).stdout
          for line in out.splitlines():
              parts = line.split("\t")
              if parts and parts[0].strip():
                  stocks.append(parts[0].strip())
          stocks = sorted(set(stocks))
          papers = ["ektacolorEdge","enduraPremier","crystalArchive","vision2383","vision2393",
                    "etternaCP","exr5386","agfaCP30","eternaCP3521XD","ilfochromeCPS1K","ilfochromeCLM1K"]
          papers = ["ektacolorEdge","enduraPremier","crystalArchive","vision2383","vision2393",
                    "eternaCP","exr5386","agfaCP30","eternaCP3521XD","ilfochromeCPS1K","ilfochromeCLM1K"]
          style = open("paper_style.txt").read().strip() if os.path.exists("paper_style.txt") else None
          print("stocks", len(stocks), "papers", len(papers), "style", style)

          def snake(name):
              return "".join("_"+c.lower() if c.isupper() else c for c in name).lstrip("_")

          os.makedirs("cubes", exist_ok=True)
          ok = 0
          for stock in stocks:
              for paper in papers:
                  cands = [paper] if style is None else ([paper] if style == paper else [paper, snake(paper)])
                  if style:
                      cands = [style if style == paper else paper, snake(paper)]
                  prod = None
                  for cand in cands:
                      r = subprocess.run([".build/release/fotufilm","lattice.png","o.png","--stock",stock,"--paper",cand],
                                         capture_output=True,text=True)
                      if r.returncode == 0 and os.path.exists("o.png"):
                          prod = cand; break
                  if not prod:
                      print("SKIP", stock, paper); continue
                  im = Image.open("o.png").convert("RGB"); w,h = im.size; p = im.load()
                  lines = []
                  for b in range(N):
                      for g in range(N):
                          for r0 in range(N):
                              k = (b*N+g)*N+r0
                              R,G,B = p[k % w, k // w]
                              lines.append("%.6f %.6f %.6f" % (R/255, G/255, B/255))
                  with open(f"cubes/ff_{stock}__{paper.replace(' ','')}.cube","w") as f:
                      f.write('TITLE "ff %s %s"\nLUT_3D_SIZE 33\n' % (stock, paper))
                      f.write("\n".join(lines)+"\n")
                  ok += 1
                  if ok % 20 == 0: print("done", ok)
          print("cubes written", ok)
          PY
      - name: Prescale and package
        working-directory: ff
        run: |
          python3 - <<'PY'
          import glob, os
          P = 0.72
          def read(path):
              hdr,size,data=[],None,[]
              for line in open(path):
                  s=line.strip()
                  if not s: hdr.append(""); continue
                  if s.startswith("#") or s[0].isalpha():
                      hdr.append(line.rstrip("\n"))
                      if s.upper().startswith("LUT_3D_SIZE"): size=int(s.split()[-1])
                      continue
                  data.append(tuple(map(float,s.split())))
              return hdr,size,data
          def sample(data,size,rgb):
              pos=[min(max(v,0.0),1.0)*(size-1) for v in rgb]
              i0=[min(int(v),size-2) for v in pos]; f=[v-i for v,i in zip(pos,i0)]
              idx=lambda r,g,b:(b*size+g)*size+r
              o=[0.0,0.0,0.0]
              for dz in (0,1):
                  for dy in (0,1):
                      for dx in (0,1):
                          wt=(f[0] if dx else 1-f[0])*(f[1] if dy else 1-f[1])*(f[2] if dz else 1-f[2])
                          c=data[idx(i0[0]+dx,i0[1]+dy,i0[2]+dz)]
                          for k in range(3): o[k]+=wt*c[k]
              return o
          os.makedirs("stage",exist_ok=True)
          for path in sorted(glob.glob("cubes/*.cube")):
              hdr,size,data=read(path)
              if not size: continue
              new=[]
              for b in range(size):
                  for g in range(size):
                      for r in range(size):
                          c=sample(data,size,(r/(size-1)*P,g/(size-1)*P,b/(size-1)*P))
                          new.append([min(1.0,max(0.0,v)) for v in c])
              with open(os.path.join("stage",os.path.basename(path)),"w") as fh:
                  fh.write(hdr[0]+"\n"); fh.write("LUT_3D_SIZE %d\n"%size)
                  for c in new: fh.write("%.6f %.6f %.6f\n"%tuple(c))
          print("prescaled", len(glob.glob("stage/*.cube")))
          PY
          cd stage && zip -q -r ../fotufilm-33.zip . && cd ..
          ls -lh fotufilm-33.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fotufilm-33
          path: ff/fotufilm-33.zip
          if-no-files-found: error
