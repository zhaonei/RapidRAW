name: Spektrafilm positives (no print)

on:
  workflow_dispatch:

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install engine
        run: |
          git clone --depth 1 https://github.com/andreavolpato/spektrafilm.git sf
          python -m pip install --upgrade pip
          pip install -e ./sf --no-deps
          pip install numpy scipy colour-science scikit-image opt-einsum numba Pillow matplotlib OpenImageIO pyfftw rawpy exiv2 lensfunpy tomli
      - name: Bake positives via runtime API
        run: |
          python - <<'PY'
          import glob, json, os, traceback
          try:
              import numpy as np
          except Exception as e:
              print("::error::numpy " + repr(e)); raise SystemExit(0)
          try:
              from spektrafilm import create_params, simulate
          except Exception as e:
              print("::error::import " + repr(e)); raise SystemExit(0)
          films=[]
          for path in glob.glob("sf/src/spektrafilm/data/profiles/*.json"):
              try: d=json.load(open(path))
              except Exception: continue
              info=d.get("info") or {}
              if info.get("support")=="film" and info.get("type")=="positive":
                  films.append(info.get("stock"))
          films=sorted(f for f in films if f)
          print("positive films", films)
          N=33
          r=np.linspace(0,1,N,dtype=np.float32)
          grid=np.stack(np.meshgrid(r,r,r,indexing="ij"),axis=-1).reshape(-1,3)
          img=grid.reshape(1,-1,3)
          os.makedirs("out", exist_ok=True)
          for f in films:
              try:
                  params=create_params(film_profile=f, print_profile=None)
                  res=simulate(img, params)
                  arr=np.asarray(res).reshape(-1,3)[:N**3]
                  enc=np.where(arr<=0.0031308, arr*12.92, 1.055*np.power(np.clip(arr,0,None),1/2.4)-0.055)
                  enc=np.clip(enc,0,1)
                  with open(f"out/{f}.cube","w") as fh:
                      fh.write('TITLE "%s direct"\nLUT_3D_SIZE %d\n'%(f,N))
                      for c in enc: fh.write("%.6f %.6f %.6f\n"%tuple(c))
                  print("OK",f)
              except Exception as e:
                  print(f"::error::{f} {repr(e)[:160]}")
                  traceback.print_exc()
          PY
      - name: Package
        run: |
          echo "--- cubes found ---"
          find out -name '*.cube' | head -20
          python - <<'PY'
          import glob, os, shutil
          os.makedirs("stage", exist_ok=True)
          for p in glob.glob("out/**/*.cube", recursive=True):
              film = os.path.relpath(p, "out").split(os.sep)[0]
              shutil.copy(p, os.path.join("stage", f"sp-{film}__direct.cube"))
          print("packed", len(glob.glob("stage/*.cube")))
          PY
          cd stage && zip -q -r ../spektrafilm-positives.zip . && cd ..
          ls -lh spektrafilm-positives.zip
      - uses: actions/upload-artifact@v4
        with:
          name: spektrafilm-positives
          path: spektrafilm-positives.zip
          if-no-files-found: error
