name: Fotufilm LUT (validate)

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Install deps
        run: brew install halide libraw little-cms2 libtiff

      - name: Clone fotufilm
        run: |
          git clone --depth 1 https://github.com/DhaliwalX/fotufilm-engine.git ff || \
          git clone --depth 1 https://github.com/zhaonei/fotufilm-engine.git ff

      - name: Build CLI
        working-directory: ff
        run: |
          swift build -c release --product fotufilm             -Xswiftc -Xfrontend -Xswiftc -solver-expression-time-threshold=10000             2>&1 | tail -60

      - name: List stocks
        working-directory: ff
        run: |
          .build/release/fotufilm --list-stocks | tee stocks.txt
          echo "---- papers ----"
          .build/release/fotufilm --list-stocks --list-stock-capabilities | head -40 || true

      - name: Python deps
        run: python3 -m pip install --break-system-packages --quiet pillow numpy

      - name: Bake one stock
        working-directory: ff
        run: |
          set -euo pipefail
          N=33
          python3 - <<'PY'
          from PIL import Image
          N = 33
          total = N**3
          w = 189
          h = (total + w - 1) // w
          img = Image.new("RGB", (w, h))
          px = img.load()
          idx = 0
          for b in range(N):
              for g in range(N):
                  for r in range(N):
                      px[idx % w, idx // w] = (round(r*255/(N-1)), round(g*255/(N-1)), round(b*255/(N-1)))
                      idx += 1
          img.save("lattice.png")
          print("lattice", w, h, total)
          PY
          STOCK=$(grep -o '^[A-Za-z0-9_.-]*' stocks.txt | grep -v '^$' | head -1)
          echo "stock=$STOCK"
          .build/release/fotufilm lattice.png out.png --stock "$STOCK" 2>&1 | tail -20
          python3 - <<PY
          from PIL import Image
          N = 33
          im = Image.open("out.png").convert("RGB")
          w, h = im.size
          px = im.load()
          lines = []
          for b in range(N):
              for g in range(N):
                  for r in range(N):
                      i = (b*N + g)*N + r
                      x, y = i % w, i // w
                      R, G, B = px[x, y]
                      lines.append("%.6f %.6f %.6f" % (R/255, G/255, B/255))
          with open("ff-${STOCK}.cube", "w") as f:
              f.write('TITLE "ff ${STOCK}"\nLUT_3D_SIZE 33\n')
              f.write("\n".join(lines) + "\n")
          print("cube entries", len(lines))
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotufilm-validate
          path: |
            ff/*.cube
            ff/stocks.txt
            ff/out.png
          if-no-files-found: warn
