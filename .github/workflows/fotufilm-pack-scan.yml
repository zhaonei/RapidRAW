name: Fotufilm pack scan

on:
  workflow_dispatch:

jobs:  # probe engine exports + build wasm
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout fotufilm (fork with web build)
        uses: actions/checkout@v4
        with:
          repository: zhaonei/fotufilm-engine
          path: ff
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Run prepare.sh (runtime assets)
        run: |
          cd ff/flutter
          chmod +x tool/prepare.sh
          ./tool/prepare.sh 2>&1 | tail -30
          echo '--- packs after prepare ---'
          find .. -name 'index.json' -path '*pack*' | head -20
          find .. -type d -name packs | head -10

      - name: Build web app (generates packs)
        run: |
          cd ff/web && npm ci
          cd ../../ff/flutter
          chmod +x tool/build-web.sh
          ./tool/build-web.sh 2>&1 | tail -30

      - name: Install emsdk
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Show engine exports (source)
        run: |
          grep -n 'EMSCRIPTEN_KEEPALIVE\|extern "C"' ff/web/engine/*.cpp | head -60

      - name: (skip) engine wasm
        run: echo "web build already emitted engine" 

      - name: Scan for packs and assets
        if: always()
        run: |
          echo '--- large files in ff (>=200KB) ---'
          find ff -type f -size +200k -printf '%10s %p\n' 2>/dev/null | sort -rn | head -40
          echo '--- pack/bin/json candidates ---'
          find ff -type f \( -name '*.pack' -o -name '*.bin' -o -name '*.ffpack' \) | head -40
          echo '--- build web assets ---'
          ls -l ff/flutter/build/web/assets 2>/dev/null | head -20
          du -sh ff/flutter/build/web 2>/dev/null

      - name: List produced wasm artifacts
        if: always()
        run: |
          find ff -name '*.wasm' -o -name '*.js' -path '*engine*' | head -20
          ls -l ff/flutter/build/web 2>/dev/null | head

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-probe
          path: |
            ff/flutter/build/web
          retention-days: 3
          if-no-files-found: warn
