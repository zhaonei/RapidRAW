name: Publish fotufilm LUTs

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'source run id'
        required: true
        default: '44310036080'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download baked LUTs
        uses: actions/download-artifact@v4
        with:
          name: fotufilm-33
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out

      - name: Zip
        run: |
          cd out
          zip -q -r ../fotufilm-33.zip .
          cd ..
          ls -lh fotufilm-33.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lut-fotufilm
          name: Fotufilm LUT library (33, sRGB)
          body: |
            400 x 33^3 LUTs baked from fotufilm (all stocks x 11 papers, reversals scanned directly).
            Filename: ff_<stock>__<paper>.cube
          files: fotufilm-33.zip
