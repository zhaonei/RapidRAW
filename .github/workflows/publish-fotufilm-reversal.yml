name: Publish fotufilm reversals

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: source run id
        required: true
        default: '44429514888'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fotufilm-reversal
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out
      - name: Merge into one zip
        run: |
          cd out
          ls -lh
          unzip -o -q *.zip -d cubes
          cd cubes && zip -q -r ../fotufilm-reversal.zip . && cd ..
          ls -lh fotufilm-reversal.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: lut-fotufilm-reversal
          name: Fotufilm reversals (33, sRGB, no prescale)
          body: |
            Slide/reversal stocks scanned directly (PrintPaper .screen), no -0.47EV prescale.
            Filename: ff_<stock>__screen.cube
          files: out/fotufilm-reversal.zip
